# AutoLink 設定ファイル (key=value / # はコメント)。変更後は AutoLink.exe を再起動してください。
CheckIntervalSec=30
RetryIntervalSec=10
FailThreshold=3
ProbeTimeoutSec=5
ReconnectWaitSec=45
AdapterResetAfterFails=2
RestartPerSec=true
# タスクマネージャーで見える PerSec のプロセス名 (拡張子なし)
PerSecProcess=parsecd
# 空なら「起動中のPerSecから自動取得」→「Program Files等を検索」の順で探します
PerSecPath=C:\Program Files\Parsec\parsecd.exe
# 空なら接続中のプロファイルを自動検出します
WifiProfile=aterm-7cfcc3-a
